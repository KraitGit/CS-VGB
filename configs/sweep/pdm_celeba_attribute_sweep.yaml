        cs_vgb:
          forward_size: 2                            # L_F
          backward_size: 2                           # L_B
          depth_alpha: 0.3
          endpoint_samples: 8                        # m_e (unguided)
          guidance_samples: 2                        # m_g (guided)
      2048:
        inference_common:
          num_particles: 1
          checkpoint_intervals: 16                    # J: uniform grid, clean 0 -> noise 1
        cs_vgb:
          forward_size: 2                            # L_F
          backward_size: 2                           # L_B
          depth_alpha: 0.3
          endpoint_samples: 8                        # m_e (unguided)
          guidance_samples: 2                        # m_g (guided)
      4096:
        inference_common:
          num_particles: 1
          checkpoint_intervals: 32                    # J: uniform grid, clean 0 -> noise 1
        cs_vgb:
          forward_size: 2                            # L_F
          backward_size: 2                           # L_B
          depth_alpha: 0.3
          endpoint_samples: 8                        # m_e (unguided)
          guidance_samples: 4                        # m_g (guided)
      8192:
        inference_common:
          num_particles: 1
          checkpoint_intervals: 32                    # J: uniform grid, clean 0 -> noise 1
        cs_vgb:
          forward_size: 2                            # L_F
